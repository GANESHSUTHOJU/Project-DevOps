services:
  # Backend Service
  - type: web
    name: project-devops-backend
    env: node
    repo: https://github.com/GANESHSUTHOJU/Project-DevOps.git
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
    healthCheckPath: /api/health
    
  # Frontend Service  
  - type: web
    name: project-devops-frontend
    env: static
    repo: https://github.com/GANESHSUTHOJU/Project-DevOps.git
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: build
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
