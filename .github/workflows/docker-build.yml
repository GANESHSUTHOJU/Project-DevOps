name: Docker Build and Test

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'

env:
  REGISTRY: docker.io
  IMAGE_NAME: devops-app
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker-build-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: false
        load: true
        tags: webapp-backend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: false
        load: true
        tags: webapp-frontend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Test Docker Compose
      run: |
        # Create test docker-compose file
        cat > docker-compose.test.yml << EOF
        services:
          backend:
            image: webapp-backend:test
            container_name: test-backend
            ports:
              - "5000:5000"
            environment:
              - NODE_ENV=test
              - PORT=5000
            healthcheck:
              test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
              interval: 10s
              timeout: 5s
              retries: 5
              start_period: 30s
            
          frontend:
            image: webapp-frontend:test
            container_name: test-frontend
            ports:
              - "80:80"
            depends_on:
              backend:
                condition: service_healthy
            healthcheck:
              test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
              interval: 10s
              timeout: 5s
              retries: 5
              start_period: 30s
        EOF
        
        # Start services
        docker-compose -f docker-compose.test.yml up -d
        
        # Wait for services to be healthy
        echo "Waiting for services to be healthy..."
        timeout 120 bash -c 'until docker-compose -f docker-compose.test.yml ps | grep -q "healthy.*healthy"; do sleep 5; done'
        
        # Test API endpoints
        echo "Testing API endpoints..."
        curl -f http://localhost:5000/api/health || exit 1
        curl -f http://localhost:5000/api/users || exit 1
        
        # Test frontend
        echo "Testing frontend..."
        curl -f http://localhost/ || exit 1
        
        # Cleanup
        docker-compose -f docker-compose.test.yml down -v
        
    - name: Generate deployment manifest
      run: |
        # Create deployment manifest for production
        cat > deployment-manifest.yml << EOF
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: webapp-backend
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: webapp-backend
          template:
            metadata:
              labels:
                app: webapp-backend
            spec:
              containers:
              - name: backend
                image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
                ports:
                - containerPort: 5000
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: webapp-frontend
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: webapp-frontend
          template:
            metadata:
              labels:
                app: webapp-frontend
            spec:
              containers:
              - name: frontend
                image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
                ports:
                - containerPort: 80
        EOF
        
        echo "✅ Deployment manifest generated successfully"
